name: Generate Google Sheet PDF

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate PDF
        run: |
          python scripts/export_sheet_pdf.py \
            "https://docs.google.com/spreadsheets/d/13yiIiIXnokkZtE0q3aGOv6RPaRo_WL3EAvd-gJ4DIgA/edit?gid=1038490019#gid=1038490019" \
            --output output/sheet-report.pdf

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/sheet-report.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh generated sheet PDF"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheet-report-pdf
          path: output/sheet-report.pdf
